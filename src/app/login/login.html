<div class="login-container">

  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

    <h2>Login</h2>

    <div class="form-group">
      <label for="email">Email</label>
      <input
        id="email"
        type="email"
        formControlName="email"
        placeholder="din@email.com">

      <div *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.hasError('required')" class="error">
        Email is required.
      </div>
      <div *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.hasError('email')" class="error">
        Enter a valid email.
      </div>
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input
        id="password"
        type="password"
        formControlName="password"
        placeholder="Your password">

      <div *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.hasError('required')" class="error">
        Password is required.
      </div>
    </div>

    <div *ngIf="errorMessage" class="error api-error">
      {{ errorMessage }}
    </div>

    <button type="submit" [disabled]="loginForm.invalid">Login</button>

    <p class="register-link">
      Don't have an account? <a [routerLink]="'/register'">Create one here</a>
    </p>

  </form>
</div>
